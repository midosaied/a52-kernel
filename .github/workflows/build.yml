
name: Build a52sxq Kernel - Infinity X + KernelSU

on:
  workflow_dispatch:
    inputs:
      ksu_ref:
        description: "KernelSU branch or tag"
        required: true
        default: "main"
      build_config:
        description: "Use config.txt from repository when available"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: a52sxq-kernel-build
  cancel-in-progress: false

jobs:
  build:
    name: Build Android 17 kernel for a52sxq
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    env:
      KERNEL_REPO: https://github.com/LineageOS/android_kernel_samsung_sm7325
      KERNEL_BRANCH: lineage-24.0
      KERNEL_COMMIT: 7a71935c393b
      EXPECTED_RELEASE: 5.4.302-qgki-g7a71935c393b
      DEFCONFIG: vendor/lineage-a52sxq_defconfig
      KSU_REF: ${{ inputs.ksu_ref }}

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            git lld make pahole python3 python-is-python3 \
            unzip zip zstd libssl-dev libelf-dev \
            device-tree-compiler

      - name: Download Clang r596125
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/clang"
          cd "$RUNNER_TEMP"

          downloaded=0

          for branch in main-kernel main master; do
            url="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/${branch}/clang-r596125.tar.gz"

            echo "Trying Clang archive: $branch"

            if curl -fL --retry 2 "$url" -o clang.tar.gz; then
              if tar -xzf clang.tar.gz -C "$RUNNER_TEMP/clang"; then
                downloaded=1
                break
              fi
            fi
          done

          if [ "$downloaded" -ne 1 ]; then
            echo "::error::Could not download Clang r596125."
            echo "Verify the actual toolchain URL and branch."
            exit 1
          fi

          test -x "$RUNNER_TEMP/clang/bin/clang"
          "$RUNNER_TEMP/clang/bin/clang" --version

          echo "$RUNNER_TEMP/clang/bin" >> "$GITHUB_PATH"

      - name: Clone and verify kernel source
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            --filter=blob:none \
            --no-checkout \
            --branch "$KERNEL_BRANCH" \
            "$KERNEL_REPO" kernel

          cd kernel

          git fetch --depth=1 origin "$KERNEL_COMMIT"
          git checkout --detach FETCH_HEAD

          actual="$(git rev-parse HEAD)"
          echo "Kernel commit: $actual"

          if [[ "$actual" != "$KERNEL_COMMIT"* ]]; then
            echo "::error::Kernel commit does not match requested hash."
            exit 1
          fi

          echo "Kernel source commit verified."

          if [ ! -f "arch/arm64/configs/$DEFCONFIG" ]; then
            echo "::error::Defconfig not found: arch/arm64/configs/$DEFCONFIG"
            echo "Check the actual defconfig name in the kernel source."
            exit 1
          fi

      - name: Integrate KernelSU
        shell: bash
        run: |
          set -euo pipefail
          cd kernel

          setup="$RUNNER_TEMP/kernelsu-setup.sh"

          curl -fL --retry 3 \
            https://raw.githubusercontent.com/rsuntk/KernelSU/main/kernel/setup.sh \
            -o "$setup"

          bash -s "$KSU_REF" < "$setup"

          if [ ! -d KernelSU ] && [ ! -d drivers/kernelsu ]; then
            echo "::error::KernelSU source directory was not found after setup."
            exit 1
          fi

          echo "KernelSU integration directory found."

      - name: Configure kernel
        shell: bash
        env:
          USE_UPLOADED_CONFIG: ${{ inputs.build_config }}
        run: |
          set -euo pipefail
          cd kernel

          mkdir -p out

          if [ "$USE_UPLOADED_CONFIG" = "true" ] &&
             [ -f "$GITHUB_WORKSPACE/config.txt" ]; then
            echo "Using config.txt as the initial kernel config."
            cp "$GITHUB_WORKSPACE/config.txt" out/.config
            make O=out ARCH=arm64 olddefconfig
          else
            echo "Using the source tree defconfig."
            make O=out ARCH=arm64 "$DEFCONFIG"
          fi

          # KernelSU must be present in Kconfig before enabling it.
          if ! grep -RqsE \
            '^[[:space:]]*config KSU([[:space:]]|$)' \
            drivers KernelSU 2>/dev/null; then
            echo "::error::Could not find the KernelSU Kconfig entry."
            exit 1
          fi

          scripts/config --file out/.config -e KSU

          # Prevent an unwanted -dirty suffix after KernelSU changes.
          scripts/config --file out/.config -d LOCALVERSION_AUTO

          make O=out ARCH=arm64 olddefconfig

          grep -E \
            '^(CONFIG_KSU=|CONFIG_LOCALVERSION=|CONFIG_LOCALVERSION_AUTO=|CONFIG_CFI_CLANG=|CONFIG_LTO_CLANG=)' \
            out/.config || true

          if ! grep -q '^CONFIG_KSU=y$' out/.config; then
            echo "::error::CONFIG_KSU=y was not enabled."
            exit 1
          fi

          release="$(make -s O=out ARCH=arm64 \
            LOCALVERSION=-g7a71935c393b kernelrelease)"

          echo "Kernel release: $release"

          if [ "$release" != "$EXPECTED_RELEASE" ]; then
            echo "::error::Kernel release mismatch."
            echo "Expected: $EXPECTED_RELEASE"
            echo "Actual:   $release"
            exit 1
          fi

      - name: Build kernel Image
        shell: bash
        run: |
          set -euo pipefail
          cd kernel

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LOCALVERSION=-g7a71935c393b \
            Image

          test -s out/arch/arm64/boot/Image

          file out/arch/arm64/boot/Image
          sha256sum out/arch/arm64/boot/Image

      - name: Validate AnyKernel3 installer
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "$GITHUB_WORKSPACE/anykernel.sh" ]; then
            echo "::error::Put your anykernel.sh in the repository root."
            exit 1
          fi

          grep -q 'device.name1=a52sxq' \
            "$GITHUB_WORKSPACE/anykernel.sh"

          grep -q 'BLOCK=boot' \
            "$GITHUB_WORKSPACE/anykernel.sh"

          grep -q 'split_boot;' \
            "$GITHUB_WORKSPACE/anykernel.sh"

          grep -q 'flash_boot;' \
            "$GITHUB_WORKSPACE/anykernel.sh"

          if grep -qE 'BLOCK=.*vendor_boot|BLOCK=.*recovery' \
             "$GITHUB_WORKSPACE/anykernel.sh"; then
            echo "::error::Installer targets a prohibited partition."
            exit 1
          fi

      - name: Package AnyKernel3 ZIP
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git AnyKernel3

          cd AnyKernel3

          rm -rf .git .github
          rm -f README.md

          cp "$GITHUB_WORKSPACE/anykernel.sh" anykernel.sh
          cp "$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image" Image

          test -s Image
          test -s tools/ak3-core.sh

          zip -r9 "$GITHUB_WORKSPACE/AnyKernel3-a52sxq-KernelSU.zip" .

          unzip -t "$GITHUB_WORKSPACE/AnyKernel3-a52sxq-KernelSU.zip"

          sha256sum "$GITHUB_WORKSPACE/AnyKernel3-a52sxq-KernelSU.zip"

      - name: Upload kernel and ZIP
        uses: actions/upload-artifact@v4
        with:
          name: a52sxq-infinityx-kernel-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: |
            kernel/out/arch/arm64/boot/Image
            kernel/out/.config
            AnyKernel3-a52sxq-KernelSU.zip
