name: Build a52sxq Kernel - Infinity X + KernelSU

on:
  workflow_dispatch:
    inputs:
      ksu_ref:
        description: "KernelSU-Next legacy tag (v3.2.0-legacy is tested by bone-machine)"
        required: true
        default: "v3.2.0-legacy"
      build_config:
        description: "Use config.txt from repository when available"
        required: true
        type: boolean
        default: true
      cfi_permissive:
        description: "CFI violations only warn instead of panicking (bootloop test build)"
        required: true
        type: boolean
        default: true
      boot_id:
        description: "Drive file ID of the ROM's original boot.img (used to make a ready boot.img)"
        required: true
        default: "1Q8q51K8Ytx_aKMQSR34dKxMxH_lUtbM2"

permissions:
  contents: read

concurrency:
  group: a52sxq-kernel-build
  cancel-in-progress: false

jobs:
  build:
    name: Build Android 17 kernel for a52sxq
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    env:
      KERNEL_REPO: https://github.com/LineageOS/android_kernel_samsung_sm7325
      KERNEL_BRANCH: lineage-24.0
      KERNEL_COMMIT: 7a71935c393b
      EXPECTED_RELEASE: 5.4.302-qgki-g7a71935c393b
      DEFCONFIG: vendor/lineage-a52sxq_defconfig
      KSU_REF: ${{ inputs.ksu_ref }}
      CFI_PERMISSIVE: ${{ inputs.cfi_permissive }}
      ZIP_NAME: AnyKernel3-a52sxq-KernelSU${{ inputs.cfi_permissive && '-cfiperm' || '' }}.zip
      FLASH_ZIP: a52sxq-bootimg${{ inputs.cfi_permissive && '-cfiperm' || '' }}-flashable.zip

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex file \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            git lld make pahole python3 python-is-python3 \
            unzip zip zstd libssl-dev libelf-dev \
            device-tree-compiler

      - name: Cache Clang
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/clang
          key: clang-r596125-v1

      - name: Download Clang r596125
        if: steps.clang-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/clang"
          cd "$RUNNER_TEMP"

          downloaded=0

          for branch in main-kernel main master; do
            url="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/${branch}/clang-r596125.tar.gz"
            echo "Trying Clang archive: $branch"

            if curl -fL --retry 2 "$url" -o clang.tar.gz; then
              if tar -xzf clang.tar.gz -C "$RUNNER_TEMP/clang"; then
                downloaded=1
                break
              fi
            fi
          done

          if [ "$downloaded" -ne 1 ]; then
            echo "::error::Could not download Clang r596125."
            exit 1
          fi

      - name: Add Clang to PATH
        shell: bash
        run: |
          set -euo pipefail
          test -x "$RUNNER_TEMP/clang/bin/clang"
          "$RUNNER_TEMP/clang/bin/clang" --version
          echo "$RUNNER_TEMP/clang/bin" >> "$GITHUB_PATH"

      - name: Clone and verify kernel source
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            --filter=blob:none \
            --no-checkout \
            --branch "$KERNEL_BRANCH" \
            "$KERNEL_REPO" kernel

          cd kernel

          if ! git cat-file -e "${KERNEL_COMMIT}^{commit}" 2>/dev/null; then
            echo "::error::Commit $KERNEL_COMMIT is not in branch $KERNEL_BRANCH."
            echo "Recent commits on this branch:"
            git log --oneline -n 20 "origin/$KERNEL_BRANCH"
            exit 1
          fi

          git checkout --detach "$KERNEL_COMMIT"
          echo "Kernel commit: $(git rev-parse HEAD)"

          if [ ! -f "arch/arm64/configs/$DEFCONFIG" ]; then
            echo "::error::Defconfig not found: arch/arm64/configs/$DEFCONFIG"
            find arch/arm64/configs -iname '*a52*' || true
            exit 1
          fi

      - name: Integrate KernelSU-Next (legacy, manual hooks)
        shell: bash
        run: |
          set -euo pipefail
          cd kernel

          # Full clone on purpose: KernelSU-Next derives its version from git history.
          git clone --branch "$KSU_REF" \
            https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
          echo "KernelSU-Next commit: $(git -C KernelSU-Next rev-parse --short HEAD)"
          echo "KernelSU-Next commits: $(git -C KernelSU-Next rev-list --count HEAD)"

          test -f KernelSU-Next/kernel/Kconfig

          ln -sfn ../KernelSU-Next/kernel drivers/kernelsu

          if ! grep -q 'kernelsu' drivers/Makefile; then
            printf '\n# KernelSU-Next\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          fi

          if ! grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig; then
            python3 - <<'KCONF_EOF'
          p = "drivers/Kconfig"
          s = open(p).read()
          i = s.rindex("endmenu")
          s = s[:i] + '\n# KernelSU-Next\nsource "drivers/kernelsu/Kconfig"\n\n' + s[i:]
          open(p, "w").write(s)
          KCONF_EOF
          fi

          cat > "$RUNNER_TEMP/ksu_manual_hooks.py" <<'HOOKS_EOF'
          #!/usr/bin/env python3
          """Apply KernelSU-Next manual hooks to a Linux 5.4 kernel tree (arm64).
          Usage: ksu_manual_hooks.py <kernel_root>
          Every anchor must match exactly once, otherwise the script fails loudly."""
          import sys, pathlib

          root = pathlib.Path(sys.argv[1])

          def patch(rel, edits):
              p = root / rel
              s = p.read_text()
              if "ksu_handle" in s or "ksu_vfs_read_hook" in s:
                  print(f"[skip] {rel}: already patched")
                  return
              for old, new in edits:
                  n = s.count(old)
                  if n != 1:
                      sys.exit(f"::error::{rel}: anchor found {n} times (need exactly 1):\n{old}")
                  s = s.replace(old, new)
              p.write_text(s)
              print(f"[ok]   {rel}")

          # ---------------- fs/exec.c ----------------
          patch("fs/exec.c", [
          (
          """int do_execve(struct filename *filename,
          	const char __user *const __user *__argv,
          	const char __user *const __user *__envp)
          {
          	struct user_arg_ptr argv = { .ptr.native = __argv };
          	struct user_arg_ptr envp = { .ptr.native = __envp };
          	return do_execveat_common(AT_FDCWD, filename, argv, envp, 0);
          }
          """,
          """#ifdef CONFIG_KSU
          extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv,
          			       void *envp, int *flags);
          #endif

          int do_execve(struct filename *filename,
          	const char __user *const __user *__argv,
          	const char __user *const __user *__envp)
          {
          	struct user_arg_ptr argv = { .ptr.native = __argv };
          	struct user_arg_ptr envp = { .ptr.native = __envp };
          #ifdef CONFIG_KSU
          	ksu_handle_execveat((int *)AT_FDCWD, &filename, &argv, &envp, 0);
          #endif
          	return do_execveat_common(AT_FDCWD, filename, argv, envp, 0);
          }
          """),
          ])

          # ---------------- fs/open.c ----------------
          patch("fs/open.c", [
          (
          """SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)
          {
          	return do_faccessat(dfd, filename, mode);
          }
          """,
          """#ifdef CONFIG_KSU
          extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user,
          				int *mode, int *flags);
          #endif

          SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)
          {
          #ifdef CONFIG_KSU
          	ksu_handle_faccessat(&dfd, &filename, &mode, NULL);
          #endif
          	return do_faccessat(dfd, filename, mode);
          }
          """),
          ])

          # ---------------- fs/read_write.c ----------------
          patch("fs/read_write.c", [
          (
          """SYSCALL_DEFINE3(read, unsigned int, fd, char __user *, buf, size_t, count)
          {
          	return ksys_read(fd, buf, count);
          }
          """,
          """#ifdef CONFIG_KSU
          extern bool ksu_vfs_read_hook __read_mostly;
          extern void ksu_handle_sys_read(unsigned int fd);
          #endif

          SYSCALL_DEFINE3(read, unsigned int, fd, char __user *, buf, size_t, count)
          {
          #ifdef CONFIG_KSU
          	if (unlikely(ksu_vfs_read_hook))
          		ksu_handle_sys_read(fd);
          #endif
          	return ksys_read(fd, buf, count);
          }
          """),
          ])

          # ---------------- fs/stat.c ----------------
          patch("fs/stat.c", [
          (
          """#if !defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_SYS_NEWFSTATAT)
          SYSCALL_DEFINE4(newfstatat, int, dfd, const char __user *, filename,
          		struct stat __user *, statbuf, int, flag)
          {
          	struct kstat stat;
          	int error;

          	error = vfs_fstatat(dfd, filename, &stat, flag);
          	if (error)
          		return error;
          	return cp_new_stat(&stat, statbuf);
          }
          #endif

          SYSCALL_DEFINE2(newfstat, unsigned int, fd, struct stat __user *, statbuf)
          {
          	struct kstat stat;
          	int error = vfs_fstat(fd, &stat);

          	if (!error)
          		error = cp_new_stat(&stat, statbuf);

          	return error;
          }
          """,
          """#ifdef CONFIG_KSU
          extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);
          extern void ksu_handle_newfstat_ret(unsigned int *fd, struct stat __user **statbuf_ptr);
          #endif

          #if !defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_SYS_NEWFSTATAT)
          SYSCALL_DEFINE4(newfstatat, int, dfd, const char __user *, filename,
          		struct stat __user *, statbuf, int, flag)
          {
          	struct kstat stat;
          	int error;

          #ifdef CONFIG_KSU
          	ksu_handle_stat(&dfd, &filename, &flag);
          #endif
          	error = vfs_fstatat(dfd, filename, &stat, flag);
          	if (error)
          		return error;
          	return cp_new_stat(&stat, statbuf);
          }
          #endif

          SYSCALL_DEFINE2(newfstat, unsigned int, fd, struct stat __user *, statbuf)
          {
          	struct kstat stat;
          	int error = vfs_fstat(fd, &stat);

          	if (!error)
          		error = cp_new_stat(&stat, statbuf);

          #ifdef CONFIG_KSU
          	ksu_handle_newfstat_ret(&fd, &statbuf);
          #endif
          	return error;
          }
          """),
          ])

          # ---------------- kernel/reboot.c ----------------
          patch("kernel/reboot.c", [
          (
          """SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,
          		void __user *, arg)
          {
          	struct pid_namespace *pid_ns = task_active_pid_ns(current);
          	char buffer[256];
          	int ret = 0;

          	/* We only trust the superuser with rebooting the system. */
          """,
          """#ifdef CONFIG_KSU
          extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd,
          				 void __user **arg);
          #endif

          SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,
          		void __user *, arg)
          {
          	struct pid_namespace *pid_ns = task_active_pid_ns(current);
          	char buffer[256];
          	int ret = 0;

          #ifdef CONFIG_KSU
          	ksu_handle_sys_reboot(magic1, magic2, cmd, &arg);
          #endif
          	/* We only trust the superuser with rebooting the system. */
          """),
          ])
          print("all hooks applied")
          HOOKS_EOF
          python3 "$RUNNER_TEMP/ksu_manual_hooks.py" .

          # KernelSU-Next patches fs/namespace.c and friends from its Kbuild, but only
          # while drivers/ is being built, which is too late (fs/ is already compiled).
          # Run that same backport section now, before the build starts.
          {
            printf 'all:\n\t@true\n\n'
            sed -n '/^# some backports/,$p' KernelSU-Next/kernel/Kbuild
          } > "$RUNNER_TEMP/ksu_backports.mk"
          make -s -f "$RUNNER_TEMP/ksu_backports.mk" srctree=.
          grep -q '^int path_umount' fs/namespace.c
          grep -q 'path_umount' fs/internal.h

          grep -q ksu_handle_sys_reboot kernel/reboot.c
          echo "KernelSU-Next integrated with manual hooks."

      - name: Configure kernel
        shell: bash
        env:
          USE_UPLOADED_CONFIG: ${{ inputs.build_config }}
        run: |
          set -euo pipefail
          cd kernel

          mkdir -p out

          if [ "$USE_UPLOADED_CONFIG" = "true" ] &&
             [ -f "$GITHUB_WORKSPACE/config.txt" ]; then
            echo "Using config.txt as the initial kernel config."
            cp "$GITHUB_WORKSPACE/config.txt" out/.config
            make O=out ARCH=arm64 LLVM=1 olddefconfig
          else
            echo "Using the source tree defconfig."
            make O=out ARCH=arm64 LLVM=1 "$DEFCONFIG"
          fi

          if ! grep -RqsE \
            '^[[:space:]]*config KSU([[:space:]]|$)' \
            drivers/kernelsu/ 2>/dev/null; then
            echo "::error::Could not find the KernelSU-Next Kconfig entry."
            exit 1
          fi

          scripts/config --file out/.config -e KSU
          scripts/config --file out/.config -e KSU_MANUAL_HOOK
          scripts/config --file out/.config -d KSU_KPROBES_HOOK
          scripts/config --file out/.config -d LOCALVERSION_AUTO

          if [ "$CFI_PERMISSIVE" = "true" ]; then
            scripts/config --file out/.config -e CFI_PERMISSIVE
          fi

          make O=out ARCH=arm64 LLVM=1 olddefconfig

          grep -E \
            '^(CONFIG_KSU|CONFIG_LOCALVERSION=|CONFIG_CFI_CLANG=|CONFIG_CFI_PERMISSIVE=|CONFIG_LTO_CLANG=)' \
            out/.config || true

          if ! grep -q '^CONFIG_KSU=y$' out/.config; then
            echo "::error::CONFIG_KSU=y was not enabled."
            exit 1
          fi

          if ! grep -q '^CONFIG_KSU_MANUAL_HOOK=y$' out/.config; then
            echo "::error::CONFIG_KSU_MANUAL_HOOK=y was not enabled."
            exit 1
          fi

          if [ "$CFI_PERMISSIVE" = "true" ] &&
             ! grep -q '^CONFIG_CFI_PERMISSIVE=y$' out/.config; then
            echo "::error::CONFIG_CFI_PERMISSIVE=y was not enabled."
            exit 1
          fi

          if grep -q '^CONFIG_KSU_KPROBES_HOOK=y$' out/.config; then
            echo "::error::KSU_KPROBES_HOOK must be off on 5.4."
            exit 1
          fi

          release="$(make -s O=out ARCH=arm64 LLVM=1 \
            LOCALVERSION=-g7a71935c393b kernelrelease)"

          echo "Kernel release: $release"

          if [ "$release" != "$EXPECTED_RELEASE" ]; then
            echo "::warning::Kernel release mismatch."
            echo "Expected: $EXPECTED_RELEASE"
            echo "Actual:   $release"
          fi

      - name: Build kernel Image
        shell: bash
        run: |
          set -euo pipefail
          cd kernel

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LOCALVERSION=-g7a71935c393b \
            Image

          test -s out/arch/arm64/boot/Image
          file out/arch/arm64/boot/Image
          sha256sum out/arch/arm64/boot/Image

      - name: Validate AnyKernel3 installer
        shell: bash
        run: |
          set -euo pipefail

          f="$GITHUB_WORKSPACE/anykernel.sh"

          if [ ! -f "$f" ]; then
            echo "::error::Put anykernel.sh in the repository root."
            exit 1
          fi

          grep -q 'device.name1=a52sxq' "$f"
          grep -q 'BLOCK=boot' "$f"
          grep -q 'split_boot;' "$f"
          grep -q 'flash_boot;' "$f"

          if grep -qE 'BLOCK=.*(vendor_boot|recovery)' "$f"; then
            echo "::error::Installer targets a prohibited partition."
            exit 1
          fi

      - name: Package AnyKernel3 ZIP
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git AnyKernel3

          cd AnyKernel3

          rm -rf .git .github README.md

          cp "$GITHUB_WORKSPACE/anykernel.sh" anykernel.sh
          cp "$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image" Image

          test -s Image
          test -s tools/ak3-core.sh

          zip -r9 "$GITHUB_WORKSPACE/$ZIP_NAME" .
          unzip -t "$GITHUB_WORKSPACE/$ZIP_NAME"
          sha256sum "$GITHUB_WORKSPACE/$ZIP_NAME"

      - name: Make ready boot.img (for TWRP Install Image or Odin)
        continue-on-error: true
        shell: bash
        env:
          BOOT_ID: ${{ inputs.boot_id }}
        run: |
          set -euo pipefail
          python3 -m pip install --break-system-packages gdown

          W="$RUNNER_TEMP/bootmk"
          mkdir -p "$W" "$GITHUB_WORKSPACE/boot_ready"
          cd "$W"

          curl -fL --retry 3 -o magisk.apk \
            https://github.com/topjohnwu/Magisk/releases/download/v30.7/Magisk-v30.7.apk
          unzip -o -q magisk.apk 'lib/x86_64/libmagiskboot.so' -d x
          cp x/lib/x86_64/libmagiskboot.so magiskboot
          chmod +x magiskboot

          gdown "https://drive.google.com/uc?id=$BOOT_ID" -O rom_boot.img
          [ "$(head -c 8 rom_boot.img)" = "ANDROID!" ] || { echo "::error::rom_boot.img is not a boot image"; exit 1; }

          ./magiskboot unpack rom_boot.img >/dev/null 2>&1 || true
          test -s kernel
          echo "ROM kernel: $(strings -n 8 kernel | grep -m1 'Linux version' | cut -c1-90 || true)"

          cp "$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image" kernel
          ./magiskboot repack rom_boot.img boot_new.img >/dev/null 2>&1 || true
          test -s boot_new.img

          size="$(stat -c %s boot_new.img)"
          [ "$size" -le 100663296 ] || { echo "::error::boot_new.img is bigger than the boot partition"; exit 1; }

          mkdir v && cp boot_new.img v/ && ( cd v && ../magiskboot unpack boot_new.img >/dev/null 2>&1 || true )
          cmp v/kernel "$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image"
          echo "OK: boot_new.img contains the new kernel"

          cp boot_new.img "$GITHUB_WORKSPACE/boot_ready/boot_new.img"
          cp boot_new.img boot.img
          tar -H ustar -cf "$GITHUB_WORKSPACE/boot_ready/AP_boot_a52sxq.tar" boot.img

          sha="$(sha256sum boot_new.img | cut -d' ' -f1)"
          echo "$sha  boot_new.img  $size bytes" | tee "$GITHUB_WORKSPACE/boot_ready/boot_new.img.sha256.txt"

      - name: Make simple flashable ZIP (dd + verify, no repack in recovery)
        if: hashFiles('boot_ready/boot_new.img') != ''
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          Z="$RUNNER_TEMP/flashzip"
          mkdir -p "$Z/META-INF/com/google/android" "$Z/images"

          cp boot_ready/boot_new.img "$Z/images/boot.img"
          ( cd "$Z/images" && sha256sum boot.img > boot.img.sha256 )
          echo "# dummy: update-binary is a shell script" > "$Z/META-INF/com/google/android/updater-script"

          cat > "$Z/META-INF/com/google/android/update-binary" <<'UB_EOF'
          #!/sbin/sh
              - name: Upload kernel and ZIP
        uses: actions/upload-artifact@v4
        with:
          name: a52sxq-infinityx-kernel-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: |
            kernel/out/arch/arm64/boot/Image
            kernel/out/.config
            ${{ env.ZIP_NAME }}
            boot_ready/boot_new.img
            boot_ready/${{ env.FLASH_ZIP }}
            boot_ready/AP_boot_a52sxq.tar
            boot_ready/boot_new.img.sha256.txt
